version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-mini-realtime}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-10-01-preview}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_STORAGE_CONTAINER_AUDIO=${AZURE_STORAGE_CONTAINER_AUDIO:-audio-recordings}
      - AZURE_STORAGE_CONTAINER_IMAGES=${AZURE_STORAGE_CONTAINER_IMAGES:-camera-snapshots}
      - MAX_RECORDING_DURATION=${MAX_RECORDING_DURATION:-60}
      - SNAPSHOT_INTERVAL=${SNAPSHOT_INTERVAL:-5}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - SCORING_DIMENSIONS=${SCORING_DIMENSIONS:-fluency,accuracy,relevance,confidence,engagement}
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
